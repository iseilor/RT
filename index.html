<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Дашборд проектов</title>
    <meta name="description" content="Интерактивный дашборд управления проектами: фильтры, поиск, прогресс и активность команды">
    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="#">
            <img src="logo.png" alt="">
            <span>Ростелеком</span>
        </a>
        <label class="search">
            <img src="icons/search.png" alt="">
            <input id="search" type="search" placeholder="Поиск по проектам" autocomplete="off">
        </label>
        <div class="topbar-actions">
            <button class="icon-btn" type="button" title="Календарь"><img src="icons/calendar.png" alt="Календарь"></button>
            <button class="icon-btn has-badge" type="button" title="Уведомления"><img src="icons/notification.png" alt="Уведомления"></button>
            <span class="divider"></span>
            <div class="account">
                <img src="icons/user.png" alt="">
                <span>Иван Иванов</span>
            </div>
        </div>
    </header>

    <div class="layout">
        <nav class="sidebar" aria-label="Основное меню">
            <a class="nav-item active" href="#" title="Проекты"><img src="icons/stat-line.png" alt="Проекты"></a>
            <a class="nav-item" href="#" title="Задачи"><img src="icons/task.png" alt="Задачи"></a>
            <a class="nav-item" href="#" title="Отчёты"><img src="icons/stat-board.png" alt="Отчёты"></a>
            <a class="nav-item" href="#" title="Сообщения"><img src="icons/mess.png" alt="Сообщения"></a>
            <a class="nav-item" href="#" title="Почта"><img src="icons/email.png" alt="Почта"></a>
            <a class="nav-item" href="#" title="Настройки"><img src="icons/settings.png" alt="Настройки"></a>
            <a class="nav-item nav-exit" href="#" title="Выход"><img src="icons/exit-icon.png" alt="Выход"></a>
        </nav>

        <main class="projects">
            <div class="toolbar">
                <div class="toolbar-title">
                    <h1>Проекты</h1>
                    <div class="filters" role="tablist" id="filters">
                        <button type="button" class="filter active" data-status="all">Все</button>
                        <button type="button" class="filter" data-status="new">Начинающие</button>
                        <button type="button" class="filter" data-status="progress">В процессе</button>
                        <button type="button" class="filter" data-status="final">Финальные</button>
                        <button type="button" class="filter" data-status="done">Законченные</button>
                    </div>
                </div>
                <div class="toolbar-actions">
                    <button type="button" class="btn-primary" id="create-btn">+ Создать проект</button>
                    <div class="view-switch">
                        <button type="button" class="icon-btn" data-view="list" title="Списком"><img src="icons/menu.png" alt="Списком"></button>
                        <button type="button" class="icon-btn active" data-view="grid" title="Плиткой"><img src="icons/menu-2.png" alt="Плиткой"></button>
                    </div>
                </div>
            </div>

            <ul class="project-list grid" id="project-list"></ul>
            <p class="empty" id="empty" hidden>Ничего не найдено</p>
        </main>

        <aside class="aside">
            <section class="card">
                <h2>Недавняя активность</h2>
                <p class="muted" id="today"></p>
                <ul class="activity" id="activity"></ul>
            </section>
            <section class="card stats" id="stats"></section>
        </aside>
    </div>

    <dialog id="create-dialog">
        <form method="dialog" id="create-form">
            <h2>Новый проект</h2>
            <label>Название
                <input name="name" required maxlength="80" placeholder="Например, Мониторинг Wi-Fi">
            </label>
            <label>Срок, дней
                <input name="days" type="number" min="1" max="365" value="14" required>
            </label>
            <div class="dialog-actions">
                <button type="button" class="btn-ghost" value="cancel" id="cancel-btn">Отмена</button>
                <button type="submit" class="btn-primary" value="ok">Создать</button>
            </div>
        </form>
    </dialog>

    <script src="app.js"></script>
</body>
</html>
